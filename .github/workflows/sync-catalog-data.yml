name: Sync catalog data from Supabase

# Выгружает товары/категории/подкатегории из Supabase в статические JSON-файлы
# в репозитории. Их отдаёт быстрый github.io — клиенту не нужно ходить в
# медленный (throttled провайдером) supabase.co. Раннеры GitHub не throttled,
# поэтому здесь запрос к Supabase быстрый.

on:
  schedule:
    - cron: '*/5 * * * *'          # каждые 5 минут (страховка; минимум для GitHub)
  workflow_dispatch: {}             # + ручной запуск кнопкой в Actions
  repository_dispatch:              # + автозапуск из Supabase при правке в админке
    types: [sync-catalog]
  push:
    branches: [main]               # + при каждом деплое кода

permissions:
  contents: write

concurrency:
  group: sync-catalog-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch data from Supabase
        env:
          SUPABASE_URL: https://fquhoxxcucgesxrexsjn.supabase.co
          # Публичный anon-ключ (он и так открыт в supabase-client.js).
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxdWhveHhjdWNnZXN4cmV4c2puIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4NzM5MDYsImV4cCI6MjA5NTQ0OTkwNn0.z09KuaZ1ybuURb46iWl9Ef-HT2gbecw8Wjw3oFJl9wI
        run: |
          set -euo pipefail
          curl -fsS "$SUPABASE_URL/rest/v1/products?select=*&order=sort_order.asc,id.asc" \
            -H "apikey: $SUPABASE_ANON_KEY" -o products.json
          curl -fsS "$SUPABASE_URL/rest/v1/categories?select=id,name,show_on_homepage,sort_order,image_url,color,product_count&order=sort_order.asc,id.asc" \
            -H "apikey: $SUPABASE_ANON_KEY" -o categories.json
          curl -fsS "$SUPABASE_URL/rest/v1/subcategories?select=*&order=category_id.asc,sort_order.asc,id.asc" \
            -H "apikey: $SUPABASE_ANON_KEY" -o subcategories.json
          # Акции: мягкий fallback если таблицы нет.
          curl -fsS "$SUPABASE_URL/rest/v1/promotions?select=*&order=sort_order.asc,id.asc" \
            -H "apikey: $SUPABASE_ANON_KEY" -o promotions.json || echo '[]' > promotions.json
          if ! jq -e 'type == "array"' promotions.json >/dev/null 2>&1; then echo '[]' > promotions.json; fi
          # Новости: мягкий fallback если таблицы нет.
          curl -fsS "$SUPABASE_URL/rest/v1/news?select=*&order=sort_order.asc,id.asc" \
            -H "apikey: $SUPABASE_ANON_KEY" -o news.json || echo '[]' > news.json
          if ! jq -e 'type == "array"' news.json >/dev/null 2>&1; then echo '[]' > news.json; fi
          # Настройки: singleton-строка — берём первый элемент массива.
          curl -fsS "$SUPABASE_URL/rest/v1/settings?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -o _settings_arr.json || echo '{}' > settings.json
          if jq -e 'type == "array" and length > 0' _settings_arr.json >/dev/null 2>&1; then
            jq '.[0]' _settings_arr.json > settings.json
          else
            echo '{}' > settings.json
          fi
          rm -f _settings_arr.json

      - name: Validate JSON (must be arrays)
        run: |
          set -e
          for f in products.json categories.json subcategories.json; do
            if ! jq -e 'type == "array"' "$f" >/dev/null 2>&1; then
              echo "ERROR: $f is not a JSON array — aborting (no commit)."
              head -c 500 "$f" || true
              exit 1
            fi
          done
          echo "products:     $(jq 'length' products.json)"
          echo "categories:   $(jq 'length' categories.json)"
          echo "subcategories:$(jq 'length' subcategories.json)"
          echo "promotions:   $(jq 'length' promotions.json)"
          echo "news:         $(jq 'length' news.json)"
          echo "settings keys:$(jq 'keys | length' settings.json)"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json categories.json subcategories.json promotions.json news.json settings.json
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore: sync catalog data from Supabase [skip ci]"
          # Несколько sync-запусков (cron/push/dispatch) могут пересечься: checkout
          # берёт SHA триггера, а не свежий main, поэтому push иногда отклоняется
          # ("fetch first"). Ребейзим на актуальный origin/main и повторяем.
          # Наши JSON — всегда производные от Supabase, поэтому при конфликте
          # оставляем нашу свежевыгруженную версию (-X ours).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on origin/main and retrying."
            git fetch origin main
            git rebase -X ours origin/main
            sleep $((attempt * 2))
          done
          echo "ERROR: could not push after 5 attempts."
          exit 1
