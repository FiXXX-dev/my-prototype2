<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Подтверждение регистрации — Клевер</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--green:#2ECC71;--green-dark:#1aab58;--lime:#C8F135;--dark:#0f1a14;--text:#1a2e22;--danger:#FF3B6B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',sans-serif;background:#f8fbf9;color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
header{background:var(--dark);height:70px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--green);}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:24px;color:white;letter-spacing:-1px;text-decoration:none;}
.logo span{color:var(--lime);}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:white;border-radius:24px;padding:48px 40px;box-shadow:0 20px 50px rgba(0,0,0,0.06);max-width:460px;width:100%;text-align:center;}
.icon-circle{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:44px;}
.ic-success{background:#e8faf0;color:var(--green-dark);}
.ic-error{background:#ffe8ee;color:var(--danger);}
.ic-load{background:#f2f7f4;color:#8aaa94;}
h1{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:900;letter-spacing:-1px;margin-bottom:12px;}
p{font-size:15px;line-height:1.6;color:#5a6e62;margin-bottom:28px;}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:none;transition:all .2s;margin-bottom:12px;}
.btn-primary{background:var(--green);color:var(--dark);}
.btn-primary:hover{background:var(--lime);transform:translateY(-2px);}
.btn-ghost{background:none;color:#8aaa94;font-family:'Onest',sans-serif;font-weight:600;font-size:14px;}
.btn-ghost:hover{color:var(--text);}
.spinner{width:36px;height:36px;border:4px solid #e0ece4;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
@media(max-width:600px){.card{padding:36px 24px;}h1{font-size:22px;}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body>
<header>
  <a href="index.html" class="logo">🍀 Кле<span>вер</span></a>
</header>

<div class="wrap">
  <div class="card" id="card">
    <div class="icon-circle ic-load"><div class="spinner"></div></div>
    <h1>Подтверждаем…</h1>
    <p>Секунду, проверяем вашу ссылку.</p>
  </div>
</div>

<script>
// Признак ошибки в ссылке (просроченная/использованная) — Supabase кладёт её
// в hash как #error=...&error_description=...
const _raw = (location.hash || '') + (location.search || '');
const _isError = /[#&?]error(_code|_description)?=/.test(_raw);

function renderSuccess(){
  document.getElementById('card').innerHTML =
    '<div class="icon-circle ic-success">✓</div>' +
    '<h1>Email подтверждён!</h1>' +
    '<p>Спасибо за регистрацию в «Клевер». Ваш аккаунт активирован — теперь вы можете войти в личный кабинет.</p>' +
    '<a href="account.html" class="btn btn-primary">Войти в личный кабинет →</a>' +
    '<a href="index.html" class="btn btn-ghost">На главную</a>';
}

function renderError(){
  document.getElementById('card').innerHTML =
    '<div class="icon-circle ic-error">!</div>' +
    '<h1>Ссылка недействительна</h1>' +
    '<p>Возможно, ссылка устарела или уже была использована. Попробуйте войти — если аккаунт активен, вы попадёте в кабинет. Иначе зарегистрируйтесь заново.</p>' +
    '<a href="account.html" class="btn btn-primary">Перейти ко входу →</a>' +
    '<a href="index.html" class="btn btn-ghost">На главную</a>';
}

// Чистим токены из адресной строки (чтобы не «прилипали» при F5 и не светились).
function cleanUrl(){ try { history.replaceState(null, '', location.pathname); } catch(e){} }

if (_isError) {
  renderError();
  cleanUrl();
} else {
  // Даём Supabase SDK секунду подхватить сессию из hash (detectSessionInUrl),
  // чтобы при переходе в account.html пользователь уже был залогинен.
  setTimeout(function(){
    renderSuccess();
    cleanUrl();
  }, 700);
}
</script>
</body>
</html>
