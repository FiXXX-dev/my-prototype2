<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Clever clover">
  <defs>
    <radialGradient id="cl-leaf-a" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%" stop-color="#5fe39a"/>
      <stop offset="55%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#1a8f4a"/>
    </radialGradient>
    <radialGradient id="cl-leaf-b" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%" stop-color="#52d989"/>
      <stop offset="55%" stop-color="#26b864"/>
      <stop offset="100%" stop-color="#157d3f"/>
    </radialGradient>
    <linearGradient id="cl-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a8f4a"/>
      <stop offset="100%" stop-color="#0f6b34"/>
    </linearGradient>
  </defs>

  <!-- Stem (thin curve dropping from centre to bottom) -->
  <path d="M16 16 C 15.6 21 14.8 26 14.3 30 C 14.3 30.5 14.7 30.8 15.2 30.7 L 16.8 30.7 C 17.3 30.8 17.7 30.5 17.7 30 C 17.2 26 16.4 21 16 16 Z" fill="url(#cl-stem)"/>

  <!-- TOP LEAF — heart pointing up, tip at centre -->
  <path d="M16 16
           C 9.5 14.4 6 11.2 6.4 7.2
           C 6.7 4 9.6 2.4 12.3 4
           C 14 5 15.2 6.6 16 8.5
           C 16.8 6.6 18 5 19.7 4
           C 22.4 2.4 25.3 4 25.6 7.2
           C 26 11.2 22.5 14.4 16 16 Z"
        fill="url(#cl-leaf-a)"/>

  <!-- RIGHT LEAF — heart pointing right -->
  <path d="M16 16
           C 17.6 9.5 20.8 6 24.8 6.4
           C 28 6.7 29.6 9.6 28 12.3
           C 27 14 25.4 15.2 23.5 16
           C 25.4 16.8 27 18 28 19.7
           C 29.6 22.4 28 25.3 24.8 25.6
           C 20.8 26 17.6 22.5 16 16 Z"
        fill="url(#cl-leaf-b)"/>

  <!-- BOTTOM LEAF — heart pointing down -->
  <path d="M16 16
           C 22.5 17.6 26 20.8 25.6 24.8
           C 25.3 28 22.4 29.6 19.7 28
           C 18 27 16.8 25.4 16 23.5
           C 15.2 25.4 14 27 12.3 28
           C 9.6 29.6 6.7 28 6.4 24.8
           C 6 20.8 9.5 17.6 16 16 Z"
        fill="url(#cl-leaf-a)"/>

  <!-- LEFT LEAF — heart pointing left -->
  <path d="M16 16
           C 14.4 22.5 11.2 26 7.2 25.6
           C 4 25.3 2.4 22.4 4 19.7
           C 5 18 6.6 16.8 8.5 16
           C 6.6 15.2 5 14 4 12.3
           C 2.4 9.6 4 6.7 7.2 6.4
           C 11.2 6 14.4 9.5 16 16 Z"
        fill="url(#cl-leaf-b)"/>

  <!-- Centre highlight to soften the cross intersection -->
  <circle cx="16" cy="16" r="1.8" fill="#1a8f4a"/>
</svg>
