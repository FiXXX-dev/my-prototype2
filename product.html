<title>Товар — КЛЕВЕР</title>

<style>
:root{--green:#2ECC71;--green-dark:#1aab58;--green-light:#a8f0c6;--lime:#C8F135;--dark:#0f1a14;--dark2:#162119;--gray:#f2f7f4;--text:#1a2e22;--white:#ffffff;--accent:#FF6B35;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',sans-serif;background:var(--white);color:var(--text);}
header{position:sticky;top:0;z-index:100;background:var(--dark);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:70px;border-bottom:2px solid var(--green);}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:24px;color:var(--white);letter-spacing:-1px;display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo span{color:var(--lime);}
nav{display:flex;gap:32px;}
nav a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s;}
nav a:hover{color:var(--lime);}
.btn-phone{background:var(--green);color:var(--dark);padding:10px 20px;border-radius:40px;font-weight:700;font-size:14px;text-decoration:none;}
.breadcrumb{padding:16px 40px;background:var(--gray);font-size:13px;color:#8aaa94;}
.breadcrumb a{color:var(--green-dark);text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}
.breadcrumb span{margin:0 8px;}
.product-wrap{max-width:1200px;margin:48px auto;padding:0 40px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
.main-img{background:var(--gray);border-radius:24px;height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;border:2px solid #e0ece4;}
.main-img img{width:100%;height:100%;object-fit:contain;padding:24px;}
.main-img .placeholder{font-size:120px;}
.prod-badges{display:flex;gap:8px;margin-bottom:16px;}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.badge-hit{background:var(--accent);color:white;}
.badge-new{background:var(--green);color:var(--dark);}
.badge-sale{background:#FF3B6B;color:white;}
.badge-instock{background:#e8faf0;color:var(--green-dark);border:1px solid var(--green-light);}
.prod-title{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;line-height:1.2;letter-spacing:-1px;margin-bottom:8px;}
.prod-sku{color:#8aaa94;font-size:13px;margin-bottom:24px;}
.prod-price-block{background:var(--gray);border-radius:20px;padding:24px;margin-bottom:24px;}
.price-label{font-size:12px;color:#8aaa94;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px;}
.price-main{font-family:'Unbounded',sans-serif;font-size:42px;font-weight:900;color:var(--green-dark);line-height:1;margin-bottom:4px;}
.price-unit{font-size:14px;color:#8aaa94;}
.counter-wrap{margin-bottom:24px;}
.counter-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;}
.counter{display:inline-flex;align-items:center;border:2px solid #d0e8d8;border-radius:14px;overflow:hidden;}
.counter-btn{width:48px;height:48px;border:none;background:white;font-size:22px;cursor:pointer;color:var(--green-dark);font-weight:700;display:flex;align-items:center;justify-content:center;}
.counter-btn:hover{background:var(--gray);}
.counter-val{width:60px;text-align:center;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;border:none;outline:none;background:white;color:var(--text);}
.buy-btns{display:flex;gap:12px;margin-bottom:28px;}
.btn-buy{flex:1;padding:18px;border-radius:14px;background:var(--green);border:none;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--dark);cursor:pointer;transition:all .2s;}
.btn-buy:hover{background:var(--lime);transform:translateY(-2px);}
.btn-cart{flex:1;padding:18px;border-radius:14px;background:white;border:2px solid #d0e8d8;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.btn-cart:hover{border-color:var(--green);background:var(--gray);}
.cart-qty-block{background:#e8faf0;border:2px solid var(--green);border-radius:16px;padding:18px 22px;text-align:center;margin-top:12px;}
.cart-qty-label{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:var(--green-dark);letter-spacing:0.5px;margin-bottom:12px;text-transform:uppercase;}
.cart-qty-control{display:flex;align-items:center;justify-content:center;gap:14px;}
.cart-qty-btn{width:44px;height:44px;background:var(--green);border:none;border-radius:50%;font-size:22px;font-weight:700;color:var(--dark);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:background .15s,transform .12s;}
.cart-qty-btn:hover{background:var(--lime);transform:scale(1.08);}
.cart-qty-val{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;color:var(--dark);min-width:50px;text-align:center;}
.cart-qty-unit{font-size:14px;color:#6b8a74;font-weight:600;}
.delivery-info{border:1.5px solid #d0e8d8;border-radius:16px;padding:20px;margin-bottom:24px;}
.delivery-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
.delivery-row:not(:last-child){border-bottom:1px solid #e8f4ec;}
.delivery-icon{font-size:22px;flex-shrink:0;}
.delivery-text strong{display:block;font-weight:600;color:var(--text);font-size:14px;}
.delivery-text span{color:#8aaa94;font-size:13px;}
.description{max-width:1200px;margin:0 auto 60px;padding:0 40px;}
.desc-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:20px;}
.desc-text{font-size:15px;line-height:1.8;color:#4a6854;max-width:700px;}
.related{max-width:1200px;margin:0 auto 60px;padding:0 40px;}
.related-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:28px;}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.related-card{background:var(--gray);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;display:block;border:1.5px solid transparent;}
.related-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.1);border-color:var(--green-light);}
.related-img{background:white;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px;}
.related-img img{width:100%;height:100%;object-fit:contain;padding:12px;}
.related-info{padding:14px;}
.related-name{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4;}
.related-price{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:900;color:var(--green-dark);}
.not-found{max-width:600px;margin:80px auto;padding:0 20px;text-align:center;}
.not-found h2{font-family:'Unbounded',sans-serif;font-size:32px;margin-bottom:12px;}
.not-found p{color:#8aaa94;margin-bottom:24px;}
.not-found a{display:inline-block;background:var(--green);color:var(--dark);padding:14px 28px;border-radius:30px;font-weight:700;text-decoration:none;}
footer{background:var(--dark2);padding:40px;border-top:2px solid rgba(46,204,113,0.2);display:flex;justify-content:space-between;align-items:center;}
.footer-logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:20px;color:white;}
.footer-logo span{color:var(--lime);}
footer p{color:rgba(255,255,255,0.25);font-size:13px;}
.footer-links{display:flex;gap:24px;}
.footer-links a{color:rgba(255,255,255,0.4);text-decoration:none;font-size:13px;}
.footer-links a:hover{color:var(--green);}
@media(max-width:900px){.product-wrap{grid-template-columns:1fr;padding:0 20px;gap:32px;margin:24px auto;}.related-grid{grid-template-columns:repeat(2,1fr);gap:14px;}header{padding:0 20px;}nav{display:none;}.related,.description{padding:0 20px;}}
@media(max-width:600px){.product-wrap{padding:0 16px;gap:24px;margin:16px auto;}.related,.description{padding:0 16px;}}
@media(max-width:360px){.related-grid{grid-template-columns:1fr;}}

/* ===== Sticky buy bar (mobile only) ===== */
.sticky-buy-bar{
  display:none;
  position:fixed;bottom:64px;left:0;right:0;
  background:white;border-top:1px solid #e0ece4;
  box-shadow:0 -4px 20px rgba(0,0,0,0.1);
  padding:10px 16px;z-index:145;
  transition:transform .25s ease,opacity .25s ease;
  transform:translateY(0);
}
.sticky-buy-bar.hidden{transform:translateY(120%);opacity:0;pointer-events:none;}
.sticky-buy-bar-inner{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;}
.sticky-buy-price{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;color:#1a2e22;flex-shrink:0;}
.sticky-buy-price small{font-family:'Onest',sans-serif;font-size:12px;font-weight:400;color:#8aaa94;display:block;}
.sticky-btn-add{flex:1;padding:13px 16px;border-radius:12px;background:#2ECC71;border:none;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:#0f1a14;cursor:pointer;transition:background .2s;}
.sticky-btn-add:hover{background:#C8F135;}
.sticky-qty-wrap{display:none;flex:1;align-items:center;gap:8px;}
.sticky-qty-wrap.show{display:flex;}
.sticky-qty-btn{width:38px;height:38px;border-radius:50%;background:#2ECC71;border:none;font-size:18px;font-weight:700;color:#0f1a14;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.sticky-qty-btn:hover{background:#C8F135;}
.sticky-qty-val{font-family:'Unbounded',sans-serif;font-size:18px;font-weight:900;min-width:32px;text-align:center;}
.sticky-open-cart{flex:1;padding:13px 16px;border-radius:12px;background:white;border:2px solid #2ECC71;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:700;color:#1a2e22;cursor:pointer;text-align:center;}
@media(max-width:900px){.sticky-buy-bar{display:block;}}
@media(max-width:600px){.sticky-buy-bar{bottom:64px;padding:8px 12px;}.sticky-buy-price{font-size:16px;}}
</style>
<style id="cart-inline-styles">
.cart-btn{position:relative;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:background .2s,transform .15s;flex-shrink:0;padding:0;}
.cart-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.05);}
.cart-badge{position:absolute;top:-4px;right:-4px;background:#FF6B35;color:white;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid #0f1a14;font-family:'Unbounded',sans-serif;}
.header-actions{display:flex;gap:12px;align-items:center;}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;backdrop-filter:blur(2px);}
.cart-overlay.open{opacity:1;visibility:visible;}
.cart-panel{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100%;background:white;z-index:201;transform:translateX(100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,0.15);}
.cart-panel.open{transform:translateX(0);}
.cart-header{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;border-bottom:1px solid #e0ece4;background:#0f1a14;color:white;}
.cart-header h3{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:900;letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.cart-close{width:36px;height:36px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:white;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.cart-close:hover{background:rgba(255,255,255,0.15);}
.cart-items{flex:1;overflow-y:auto;padding:20px 28px;}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px 20px;}
.cart-item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid #e8f4ec;align-items:flex-start;}
.cart-item:last-child{border-bottom:none;}
.cart-item-img{width:64px;height:64px;background:#f2f7f4;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.cart-item-img img{width:100%;height:100%;object-fit:contain;padding:6px;}
.cart-item-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;color:#1a2e22;}
.cart-item-sku{font-size:12px;color:#8aaa94;margin-bottom:12px;}
.cart-item-controls{display:flex;align-items:center;gap:8px;}
.qty-btn{width:28px;height:28px;background:#f2f7f4;border:1px solid #d0e8d8;border-radius:8px;font-size:16px;font-weight:700;color:#1aab58;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{background:#e0ece4;}
.qty-val{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;min-width:24px;text-align:center;}
.remove-btn{margin-left:8px;background:none;border:none;color:#FF3B6B;font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px;}
.remove-btn:hover{background:#ffe8ee;}
.cart-item-price{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:900;color:#1aab58;white-space:nowrap;}
.cart-footer{padding:20px 28px;border-top:1px solid #e0ece4;background:#f2f7f4;}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:16px;}
.cart-total-price{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;color:#1aab58;}
.btn-checkout{width:100%;padding:16px;background:#2ECC71;border:none;border-radius:14px;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:#0f1a14;cursor:pointer;transition:all .2s;}
.btn-checkout:hover{background:#C8F135;transform:translateY(-2px);}
.cart-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1a14;color:white;padding:14px 24px;border-radius:30px;font-size:14px;box-shadow:0 10px 40px rgba(0,0,0,0.3);z-index:300;opacity:0;transition:opacity .3s,transform .3s;display:flex;align-items:center;gap:10px;max-width:90%;}
.cart-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<style id="preloader-style">
#klever-preloader{position:fixed;inset:0;background:#0f1a14;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease;}
#klever-preloader.hidden{opacity:0;pointer-events:none;}
#klever-preloader .pre-logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:42px;color:white;letter-spacing:-1.5px;display:flex;align-items:center;gap:14px;margin-bottom:32px;}
#klever-preloader .pre-logo .leaf{font-size:48px;animation:preSpin 1.5s ease-in-out infinite;display:inline-block;}
#klever-preloader .pre-logo span{color:#C8F135;}
#klever-preloader .pre-bar{width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;}
#klever-preloader .pre-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg, transparent, #2ECC71, transparent);animation:preLoad 1.2s ease-in-out infinite;}
@keyframes preSpin{0%,100%{transform:rotate(-15deg);}50%{transform:rotate(15deg);}}
@keyframes preLoad{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
</style>
<div id="klever-preloader">
  <div class="pre-logo"><span class="leaf"><svg class="logo-icon" width="56" height="56" aria-hidden="true" focusable="false"><use href="#clover-logo"/></svg></span> <span>Клевер</span></div>
  <div class="pre-bar"></div>
</div>
<script id="preloader-script">
window.addEventListener('load', function(){
  setTimeout(function(){
    var p = document.getElementById('klever-preloader');
    if (p) {
      p.classList.add('hidden');
      setTimeout(function(){ p.remove(); }, 400);
    }
  }, 200);
});
// Fallback - если что-то застряло, убираем через 5 секунд
setTimeout(function(){
  var p = document.getElementById('klever-preloader');
  if (p) { p.classList.add('hidden'); setTimeout(function(){ p.remove(); }, 400); }
}, 5000);
</script>

<div class="sticky-buy-bar hidden" id="stickyBuyBar" aria-hidden="true">

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

  <div class="cart-header"><h3 data-i18n="cart.title"><span class="icon icon-cart"></span> Корзина</h3><button class="cart-close" onclick="closeCart()" aria-label="Close" data-i18n-aria="nav.menu_close"><span class="icon icon-close"></span></button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total"><span data-i18n="cart.total">Итого:</span><span class="cart-total-price" id="cartTotal">0 ₽</span></div>
    <button class="btn-checkout" onclick="checkout()" data-i18n="cart.checkout">Оформить заказ →</button>
  </div>
</aside>

<script id="cart-inline-script">
const CART_KEY='klever_cart';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return[];}}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartBadge();}
function addToCart(p){const c=getCart();const e=c.find(i=>i.sku===p.sku);if(e)e.qty++;else c.push({...p,qty:1});saveCart(c);showAddedToast(p.name);}
function removeFromCart(s){let c=getCart();c=c.filter(i=>i.sku!==s);saveCart(c);renderCart();if(typeof syncCartQtyBlock==='function')syncCartQtyBlock();}
function changeQty(s,d){const c=getCart();const i=c.find(x=>x.sku===s);if(!i)return;i.qty+=d;if(i.qty<=0){removeFromCart(s);return;}saveCart(c);renderCart();if(typeof syncCartQtyBlock==='function')syncCartQtyBlock();}
function getCartTotal(){return getCart().reduce((s,i)=>s+i.price*i.qty,0);}
function getCartCount(){return getCart().reduce((s,i)=>s+i.qty,0);}
function updateCartBadge(){const b=document.getElementById('cartBadge');if(!b)return;const c=getCartCount();b.textContent=c;b.style.display=c>0?'flex':'none';}
function openCart(){document.getElementById('cartOverlay').classList.add('open');document.getElementById('cartPanel').classList.add('open');document.body.style.overflow='hidden';renderCart();}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartPanel').classList.remove('open');document.body.style.overflow='';}
function getProdImg(sku,fallback){try{const arr=JSON.parse(localStorage.getItem('klever_products_v2'))||[];const p=arr.find(x=>x.sku===sku);return (p&&p.img)||fallback||'';}catch(e){return fallback||'';}}
function renderCart(){const cart=getCart();const items=document.getElementById('cartItems');const total=document.getElementById('cartTotal');if(!items)return;if(cart.length===0){items.innerHTML='<div class="cart-empty"><div style="margin-bottom:16px;"><span class="icon icon-cart" style="font-size:56px;color:#d0e8d8;"></span></div><div style="font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;margin-bottom:8px;">Корзина пуста</div><div style="color:#8aaa94;font-size:14px;">Добавьте товары из каталога</div></div>';total.textContent='0 ₽';return;}items.innerHTML=cart.map(i=>{const _img=getProdImg(i.sku,i.img);return '<div class="cart-item"><div class="cart-item-img">'+(_img?'<img src="'+_img+'" alt="" onerror="this.outerHTML=\'<span style=font-size:24px>📦</span>\'">':'<span style="font-size:24px">📦</span>')+'</div><div class="cart-item-info"><div class="cart-item-name">'+i.name+'</div><div class="cart-item-sku">Арт. '+i.sku+' · '+i.price+' ₽</div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty(\''+i.sku+'\', -1)">−</button><span class="qty-val">'+i.qty+'</span><button class="qty-btn" onclick="changeQty(\''+i.sku+'\', 1)">+</button><button class="remove-btn" onclick="removeFromCart(\''+i.sku+'\')">Удалить</button></div></div><div class="cart-item-price">'+(i.price*i.qty)+' ₽</div></div>';}).join('');total.textContent=getCartTotal()+' ₽';}
function checkout(){if(getCartCount()===0){alert('Корзина пуста! Добавьте товары.');return;}window.location.href='checkout.html';}
function showAddedToast(name){let t=document.getElementById('cartToast');if(t)t.remove();t=document.createElement('div');t.id='cartToast';t.className='cart-toast';t.innerHTML='<span class="icon icon-check" style="color:#2ECC71;font-size:18px;"></span> «'+name+'» добавлен в корзину';document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2200);}
document.addEventListener('DOMContentLoaded',updateCartBadge);
</script>

// Загружаем товары: из localStorage (если есть) или дефолт
let PRODUCTS;
try {
  const stored = localStorage.getItem('klever_products_v2');
  const parsed = stored ? JSON.parse(stored) : null;
  if (parsed && Array.isArray(parsed) && parsed.length > 0) {
    PRODUCTS = parsed;
  } else {
    PRODUCTS = DEFAULT_PRODUCTS;
    localStorage.setItem('klever_products_v2', JSON.stringify(DEFAULT_PRODUCTS));
  }
} catch(e) {
  PRODUCTS = DEFAULT_PRODUCTS;
}


// Парсим SKU из URL
const urlParams = new URLSearchParams(window.location.search);
const sku = urlParams.get('sku') || PRODUCTS[0].sku;
const product = PRODUCTS.find(p => p.sku === sku);

function badgeHtml(b) {
  if (b==='hit') return '<span class="badge badge-hit">🔥 ХИТ ПРОДАЖ</span>';
  if (b==='new') return '<span class="badge badge-new">✨ НОВИНКА</span>';
  if (b==='sale') return '<span class="badge badge-sale">-20%</span>';
  return '';
}

function renderProduct() {
  if (!product) {
    document.getElementById('productContent').innerHTML = `
      <div class="not-found">
        <h2>Товар не найден 😔</h2>
        <p>Возможно, такого товара нет в нашем каталоге.</p>
        <a href="catalog.html">Вернуться в каталог →</a>
      </div>`;
    document.title = 'Товар не найден — КЛЕВЕР';
    return;
  }

  document.title = product.name + ' — КЛЕВЕР';

  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">Главная</a><span>→</span>

    ${product.cat}<span>→</span>${product.name}

    ? `<img id="mainImg" src="${product.img}" alt="${product.name}" onerror="this.outerHTML='<span class=placeholder>${product.emoji||'📦'}</span>'">`
    : `<span class="placeholder">${product.emoji||'📦'}</span>`;

  // Похожие товары - 4 рандомных из той же категории
  const related = PRODUCTS.filter(p => p.cat === product.cat && p.sku !== product.sku).slice(0, 4);

  document.getElementById('productContent').innerHTML = `
    <div class="product-wrap">
      <div class="product-images">
        <div class="main-img">${imgHtml}</div>
      </div>

function changeQtyLocal(delta) {
  const el = document.getElementById('qty');
  el.value = Math.max(1, parseInt(el.value) + delta);
}

function addCurrentToCart() {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  for (let i = 0; i < qty; i++) {
    addToCart({name: product.name, sku: product.sku, price: product.price, img: product.img || ''});
  }
  syncCartQtyBlock();
}

function buyNow() {
  addCurrentToCart();
  setTimeout(openCart, 300);
}

function getProductQty(){
  try { const c = JSON.parse(localStorage.getItem('klever_cart')||'[]'); const i = c.find(x=>x.sku===product.sku); return i?i.qty:0; } catch(e){ return 0; }
}

function syncCartQtyBlock(){
  if (!product) return;
  const qty = getProductQty();
  const buyBtns = document.getElementById('buyBtns');
  const qtyBlock = document.getElementById('cartQtyBlock');
  const counterWrap = document.getElementById('counterWrap');
  if (!buyBtns || !qtyBlock) return;
  if (qty > 0) {
    // Item already in cart: hide the pre-purchase qty selector + buy buttons,
    // show the cart-state block instead.
    if (counterWrap) counterWrap.style.display = 'none';
    buyBtns.style.display = 'none';
    qtyBlock.style.display = 'block';
    document.getElementById('cartQtyVal').textContent = qty;
  } else {
    // Not in cart: show the qty selector + buy buttons, hide cart block.
    if (counterWrap) counterWrap.style.display = '';
    buyBtns.style.display = '';
    qtyBlock.style.display = 'none';
  }
  _syncStickyBar(qty);
}

function _syncStickyBar(qty){
  const bar = document.getElementById('stickyBuyBar'); if (!bar) return;
  const addBtn   = document.getElementById('stickyBtnAdd');
  const qtyWrap  = document.getElementById('stickyQtyWrap');
  const qtyVal   = document.getElementById('stickyQtyVal');
  const priceEl  = document.getElementById('stickyPriceVal');
  if (priceEl && product) priceEl.textContent = product.price;
  if (qty > 0) {
    if (addBtn)  addBtn.style.display  = 'none';
    if (qtyWrap){ qtyWrap.classList.add('show'); if (qtyVal) qtyVal.textContent = qty; }
  } else {
    if (addBtn)  addBtn.style.display  = '';
    if (qtyWrap) qtyWrap.classList.remove('show');
  }
}

function productQtyInc(){
  addToCart({name: product.name, sku: product.sku, price: product.price, img: product.img || ''});
  syncCartQtyBlock();
}

function productQtyDec(){
  const cart = getCart();
  const item = cart.find(i => i.sku === product.sku);
  if (!item) return;
  item.qty--;
  const newCart = item.qty <= 0 ? cart.filter(i => i.sku !== product.sku) : cart;
  saveCart(newCart);
  syncCartQtyBlock();
}

renderProduct();
// Fav button state
function _prodFavSet(){
  try {
    const id = localStorage.getItem('klever_current_user'); if (!id) return new Set();
    const u = (JSON.parse(localStorage.getItem('klever_users')||'[]')).find(x => x.id === id);
    return new Set(u && Array.isArray(u.favorites) ? u.favorites : []);
  } catch(e) { return new Set(); }
}
function _prodFavRender(){
  if (!product) return;
  const icon = document.getElementById('prodFavIcon'); if (!icon) return;
  const on = _prodFavSet().has(product.sku);
  icon.setAttribute('fill', on ? '#FF3B6B' : 'none');
  document.getElementById('prodFavBtn').style.background = on ? '#ffe8ee' : '#fff0f5';
}
window.toggleProdFav = function(){
  if (!product) return;
  const id = localStorage.getItem('klever_current_user');
  if (!id) { alert('Войдите в аккаунт чтобы добавлять в избранное'); location.href='account.html'; return; }
  const users = JSON.parse(localStorage.getItem('klever_users')||'[]');
  const i = users.findIndex(u => u.id === id); if (i<0) return;
  const favs = new Set(users[i].favorites || []);
  const wasOn = favs.has(product.sku);
  if (wasOn) favs.delete(product.sku); else favs.add(product.sku);
  users[i].favorites = [...favs];
  localStorage.setItem('klever_users', JSON.stringify(users));
  _prodFavRender();
  if (window.kleverSupabase && window.kleverSupabase.isConfigured()) {
    if (!wasOn && typeof window.supaAddFavorite === 'function') {
      window.supaAddFavorite({sku: product.sku, name: product.name, price: product.price, img: product.img||''}).catch(()=>{});
    } else if (wasOn && typeof window.supaRemoveFavorite === 'function') {
      window.supaRemoveFavorite(product.sku).catch(()=>{});
    }
  }
};
_prodFavRender();
syncCartQtyBlock();

// Show sticky bar when inline buy buttons scroll out of viewport
(function _initStickyBar(){
  const anchor = document.getElementById('buyBtns') || document.getElementById('cartQtyBlock');
  const bar = document.getElementById('stickyBuyBar');
  if (!anchor || !bar) return;
  // Use the parent product-info column as the sentinel — covers both buyBtns and cartQtyBlock
  const sentinel = anchor.closest('.product-info') || anchor;
  const obs = new IntersectionObserver(entries => {
    const visible = entries[0].isIntersecting;
    bar.classList.toggle('hidden', visible);
    bar.setAttribute('aria-hidden', visible ? 'true' : 'false');
  }, { threshold: 0.01 });
  obs.observe(sentinel);
})();

// Sync favorites from Supabase so the heart shows correctly on fresh devices.
(function _syncProdFavFromSupabase(){
  if (!window.kleverSupabase || !window.kleverSupabase.isConfigured()) return;
  if (typeof supaListFavorites !== 'function') return;
  supaListFavorites().then(favs => {
    if (!Array.isArray(favs)) return;
    const id = localStorage.getItem('klever_current_user'); if (!id) return;
    const users = JSON.parse(localStorage.getItem('klever_users') || '[]');
    const i = users.findIndex(u => u.id === id); if (i < 0) return;
    users[i].favorites = favs;
    localStorage.setItem('klever_users', JSON.stringify(users));
    _prodFavRender();
  }).catch(()=>{});
})();
</script>

<script id="news-modal-script">
(function(){
  const NEWS_KEY = 'klever_news';
  const SEEN_KEY = 'klever_news_seen';
  function getNews(){ try{ const a=JSON.parse(localStorage.getItem(NEWS_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function getSeen(){ try{ const a=JSON.parse(localStorage.getItem(SEEN_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function setSeen(a){ localStorage.setItem(SEEN_KEY, JSON.stringify(a)); }
  let currentNews = null;
  function pickNext(){
    const seen = getSeen();
    return getNews().find(n => n.active && !seen.includes(n.id));
  }
  function show(n){
    currentNews = n;
    const banner = document.getElementById('kleverNewsBanner');
    banner.classList.remove('green','orange','blue');
    banner.classList.add(['green','orange','blue'].includes(n.color) ? n.color : 'green');
    document.getElementById('kleverNewsTitle').textContent = n.title || '';
    document.getElementById('kleverNewsText').textContent = n.text || '';
    document.getElementById('kleverNewsOverlay').classList.add('open');
  }
  window.kleverNewsDismiss = function(){
    if (currentNews) {
      const seen = getSeen();
      if (!seen.includes(currentNews.id)) { seen.push(currentNews.id); setSeen(seen); }
    }
    document.getElementById('kleverNewsOverlay').classList.remove('open');
    currentNews = null;
    setTimeout(function(){
      const next = pickNext();
      if (next) show(next);
    }, 400);
  };
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){
      const n = pickNext();
      if (n) show(n);
    }, 800);
  });
})();
</script>

<script id="burger-menu-script">
(function(){
  function buildMenu(){
    const header = document.querySelector('header');
    if (!header) return;
    if (header.querySelector('.mobile-burger-btn')) return;
    // Get nav links (mainnav)
    const navAnchors = header.querySelectorAll('nav a');
    const links = [...navAnchors].map(a => {
      const isActive = a.classList.contains('active');
      const href = a.getAttribute('href') || '#';
      const text = a.textContent.trim();
      return '<a href="'+href+'" '+(isActive?'class="active"':'')+'>'+text+'</a>';
    }).join('');
    // Find phone link
    let phoneHref = 'tel:+78129228677', phoneText = '<span class="icon icon-phone"></span> Позвонить';
    const phoneEl = header.querySelector('.btn-phone, a[href^="tel:"]');
    if (phoneEl) { phoneHref = phoneEl.getAttribute('href'); phoneText = phoneEl.textContent.trim(); }
    // Build menu HTML
    const overlay = document.createElement('div');
    overlay.className = 'mobile-menu-overlay';
    overlay.id = 'mobileMenuOverlay';
    overlay.onclick = closeMenu;
    const panel = document.createElement('aside');
    panel.className = 'mobile-menu-panel';
    panel.id = 'mobileMenuPanel';
    panel.innerHTML = '<div class="mobile-menu-head">'
      + '<span class="mm-title"><svg width="22" height="22" aria-hidden="true" style="vertical-align:-5px;"><use href="#clover-logo"></use></svg> Меню</span>'
      + '<button class="mobile-menu-close" onclick="window.__kleverCloseMobileMenu()"><span class="icon icon-close"></span></button>'
      + '</div>'
      + '<div class="mobile-menu-links">'+links+'</div>'
      + '<div class="mobile-menu-actions">'
      + '<a href="account.html"><span class="icon icon-user"></span> <span data-i18n="nav.account">Личный кабинет</span></a>'
      + '<button id="mmCartBtn"><span class="icon icon-cart"></span> <span data-i18n="nav.cart">Корзина</span> <span class="mm-cart-badge empty" id="mmCartBadge">0</span></button>'
      + '<a href="'+phoneHref+'" class="mobile-menu-phone">'+phoneText+'</a>'
      + '</div>';
    document.body.appendChild(overlay);
    document.body.appendChild(panel);
    // Cart button
    const cartBtn = panel.querySelector('#mmCartBtn');
    cartBtn.onclick = function(){
      closeMenu();
      setTimeout(function(){ if (typeof openCart === 'function') openCart(); }, 280);
    };
    // Burger button — insert into header
    const burger = document.createElement('button');
    burger.className = 'mobile-burger-btn';
    burger.setAttribute('aria-label','Открыть меню');
    burger.innerHTML = '<span class="icon icon-menu"></span>';
    burger.onclick = openMenu;
    const actions = header.querySelector('.header-actions');
    if (actions) actions.appendChild(burger);
    else header.appendChild(burger);
    updateMmCart();
  }
  function openMenu(){
    document.getElementById('mobileMenuOverlay').classList.add('open');
    document.getElementById('mobileMenuPanel').classList.add('open');
    document.body.style.overflow='hidden';
    updateMmCart();
  }
  function closeMenu(){
    const o = document.getElementById('mobileMenuOverlay');
    const p = document.getElementById('mobileMenuPanel');
    if (o) o.classList.remove('open');
    if (p) p.classList.remove('open');
    document.body.style.overflow='';
  }
  function updateMmCart(){
    const badge = document.getElementById('mmCartBadge');
    if (!badge) return;
    let count = 0;
    try { const c = JSON.parse(localStorage.getItem('klever_cart')) || []; count = c.reduce((s,i)=>s+(i.qty||0),0); } catch(e){}
    badge.textContent = count;
    if (count > 0) badge.classList.remove('empty'); else badge.classList.add('empty');
  }
  window.__kleverCloseMobileMenu = closeMenu;
  window.__kleverUpdateMmCart = updateMmCart;
  document.addEventListener('DOMContentLoaded', buildMenu);
  // Refresh badge when cart changes (same tab via custom polling; cross-tab via storage)
  window.addEventListener('storage', e => { if (e.key === 'klever_cart') updateMmCart(); });
  // Patch updateCartBadge if exists to also sync mm
  const _origInterval = setInterval(function(){ if (typeof updateCartBadge === 'function') { const _orig = updateCartBadge; window.updateCartBadge = function(){ _orig(); updateMmCart(); }; clearInterval(_origInterval); } }, 100);
  setTimeout(function(){ clearInterval(_origInterval); }, 3000);
})();
</script>

<div class="klever-search-overlay" id="kleverSearchOverlay"></div>
<div class="klever-search-panel" id="kleverSearchPanel">
  <div class="klever-search-row">
    <input type="text" class="klever-search-input" id="kleverSearchInput" data-i18n-placeholder="search.placeholder" placeholder="Поиск по названию или артикулу..." autocomplete="off">
    <button class="klever-search-close" onclick="kleverSearchClose()" aria-label="Закрыть"><span class="icon icon-close"></span></button>
  </div>
  <div class="klever-search-results" id="kleverSearchResults"></div>
</div>
<script id="klever-search-script">
(function(){
  let debounceT = null;
  function getProducts(){
    try{ const a=JSON.parse(localStorage.getItem('klever_products_v2')); return Array.isArray(a)?a:[]; }catch(e){ return []; }
  }
  function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function openSearch(){
    document.getElementById('kleverSearchOverlay').classList.add('open');
    document.getElementById('kleverSearchPanel').classList.add('open');
    document.body.style.overflow='hidden';
    setTimeout(()=>document.getElementById('kleverSearchInput').focus(), 100);
  }
  function closeSearch(){
    document.getElementById('kleverSearchOverlay').classList.remove('open');
    document.getElementById('kleverSearchPanel').classList.remove('open');
    document.body.style.overflow='';
    document.getElementById('kleverSearchInput').value='';
    const r = document.getElementById('kleverSearchResults');
    r.classList.remove('has-content'); r.innerHTML='';
  }
  function render(query){
    const box = document.getElementById('kleverSearchResults');
    const q = query.trim().toLowerCase();
    if (!q){ box.classList.remove('has-content'); box.innerHTML=''; return; }
    const all = getProducts();
    const matches = all.filter(p => {
      const n = (p.name||'').toLowerCase();
      const s = (p.sku||'').toString().toLowerCase();
      return n.includes(q) || s.includes(q);
    }).slice(0, 8);
    box.classList.add('has-content');
    if (matches.length === 0){
      box.innerHTML = '<div class="klever-search-empty"><span class="icon icon-search icon-2x" style="display:block;margin:0 auto 10px;"></span>Ничего не найдено по запросу «'+escHtml(query)+'»</div>';
      return;
    }
    box.innerHTML = matches.map(p => {
      const imgHtml = p.img ? '<img src="'+escHtml(p.img)+'" alt="" onerror="this.outerHTML=\'<span style=font-size:22px>📦</span>\'">' : '<span style="font-size:22px">📦</span>';
      const cartData = escHtml(JSON.stringify({name:p.name,sku:p.sku,price:p.price,img:p.img||''}));
      return '<a href="product.html?sku='+escHtml(p.sku)+'" class="klever-search-result">'
        + '<div class="klever-search-result-img">'+imgHtml+'</div>'
        + '<div><div class="klever-search-result-name">'+escHtml(p.name)+'</div><div class="klever-search-result-sku">Арт. '+escHtml(p.sku)+'</div></div>'
        + '<div class="klever-search-result-price">'+escHtml(p.price)+' ₽</div>'
        + '<button class="klever-search-result-add" onclick="event.preventDefault();event.stopPropagation();kleverSearchAdd('+cartData+')" aria-label="В корзину">+</button>'
        + '</a>';
    }).join('');
  }
  window.kleverSearchClose = closeSearch;
  window.kleverSearchAdd = function(p){
    if (typeof addToCart === 'function') { addToCart(p); return; }
    try {
      const cart = JSON.parse(localStorage.getItem('klever_cart')||'[]');
      const ex = cart.find(i => i.sku === p.sku);
      if (ex) ex.qty++; else cart.push({...p, qty:1});
      localStorage.setItem('klever_cart', JSON.stringify(cart));
    } catch(e){}
    if (typeof updateCartBadge === 'function') updateCartBadge();
    if (typeof window.__kleverUpdateMmCart === 'function') window.__kleverUpdateMmCart();
  };
  document.addEventListener('DOMContentLoaded', function(){
    const header = document.querySelector('header');
    if (!header) return;
    if (header.querySelector('.search-trigger')) return;
    const btn = document.createElement('button');
    btn.className = 'search-trigger';
    btn.setAttribute('aria-label','Поиск');
    btn.innerHTML = '<span class="icon icon-search"></span>';
    btn.onclick = openSearch;
    const actions = header.querySelector('.header-actions');
    if (actions){
      const phoneBtn = actions.querySelector('.btn-phone');
      if (phoneBtn && phoneBtn.nextSibling) actions.insertBefore(btn, phoneBtn.nextSibling);
      else actions.insertBefore(btn, actions.firstChild);
    } else { header.appendChild(btn); }
    const input = document.getElementById('kleverSearchInput');
    input.addEventListener('input', e => {
      clearTimeout(debounceT);
      const q = e.target.value;
      debounceT = setTimeout(()=>render(q), 300);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('kleverSearchPanel').classList.contains('open')) closeSearch(); });
    document.getElementById('kleverSearchOverlay').addEventListener('click', closeSearch);
  });
})();
</script>

<script id="klever-recent-script">
(function(){
  const KEY = 'klever_recently_viewed';
  const MAX = 12;
  function getList(){
    try { const a = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(a) ? a : []; } catch(e) { return []; }
  }
  function setList(a){ localStorage.setItem(KEY, JSON.stringify(a.slice(0, MAX))); }
  function getProducts(){
    try { const a = JSON.parse(localStorage.getItem('klever_products_v2')); return Array.isArray(a) ? a : []; } catch(e) { return []; }
  }
  function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  // Track current product if on product.html
  function trackCurrent(){
    if (!/product\.html/i.test(location.pathname)) return;
    const sku = new URLSearchParams(location.search).get('sku');
    if (!sku) return;
    const list = getList().filter(s => s !== sku);
    list.unshift(sku);
    setList(list);
  }
  function render(){
    const host = document.getElementById('kleverRecentSection');
    if (!host) return;
    let list = getList();
    // On product page, exclude current sku
    if (/product\.html/i.test(location.pathname)) {
      const curSku = new URLSearchParams(location.search).get('sku');
      list = list.filter(s => s !== curSku);
    }
    if (!list.length) { host.style.display = 'none'; return; }
    const products = getProducts();
    const items = list.map(s => products.find(p => p.sku === s)).filter(Boolean).slice(0, 12);
    if (!items.length) { host.style.display = 'none'; return; }
    host.style.display = '';
    const strip = host.querySelector('.klever-recent-strip');
    strip.innerHTML = items.map(p => {
      const imgHtml = p.img ? '<img src="'+escHtml(p.img)+'" alt="" onerror="this.outerHTML=\'<span style=font-size:42px>📦</span>\'">' : '<span style="font-size:42px">📦</span>';
      const cartData = escHtml(JSON.stringify({name:p.name,sku:p.sku,price:p.price,img:p.img||''}));
      return '<a href="product.html?sku='+escHtml(p.sku)+'" class="klever-recent-card">'
        + '<div class="klever-recent-img">'+imgHtml+'</div>'
        + '<div class="klever-recent-info">'
        + '<div class="klever-recent-name">'+escHtml(p.name)+'</div>'
        + '<div class="klever-recent-foot">'
        + '<div class="klever-recent-price">'+escHtml(p.price)+' ₽</div>'
        + '<button class="klever-recent-add" onclick="event.preventDefault();event.stopPropagation();kleverRecentAdd('+cartData+')" aria-label="В корзину">+</button>'
        + '</div></div></a>';
    }).join('');
  }
  window.kleverRecentAdd = function(p){
    if (typeof addToCart === 'function') { addToCart(p); return; }
    try {
      const cart = JSON.parse(localStorage.getItem('klever_cart')||'[]');
      const ex = cart.find(i => i.sku === p.sku);
      if (ex) ex.qty++; else cart.push({...p, qty:1});
      localStorage.setItem('klever_cart', JSON.stringify(cart));
    } catch(e){}
    if (typeof updateCartBadge === 'function') updateCartBadge();
    if (typeof window.__kleverUpdateMmCart === 'function') window.__kleverUpdateMmCart();
  };
  document.addEventListener('DOMContentLoaded', function(){
    trackCurrent();
    // Inject block before footer if not already there
    if (!document.getElementById('kleverRecentSection')){
      const sec = document.createElement('section');
      sec.id = 'kleverRecentSection';
      sec.className = 'klever-recent';
      sec.innerHTML = '<div class="klever-recent-head"><div class="klever-recent-title">Вы недавно смотрели</div></div><div class="klever-recent-strip"></div>';
      const footer = document.querySelector('footer');
      if (footer) footer.parentNode.insertBefore(sec, footer);
      else document.body.appendChild(sec);
    }
    // Delay slightly to let product page write its track
    setTimeout(render, 50);
  });
  window.addEventListener('storage', e => { if (e.key === KEY || e.key === 'klever_products_v2') render(); });
})();
</script>

<script id="klever-lang-script">
(function(){
  const LANGS = [
    {code:'ru', flag:'🇷🇺', label:'Русский'},
    {code:'en', flag:'🇬🇧', label:'English'},
    {code:'zh', flag:'🇨🇳', label:'中文'},
    {code:'ko', flag:'🇰🇷', label:'한국어'},
  ];
  const FLAG_MAP = {ru:'🇷🇺',en:'🇬🇧',zh:'🇨🇳',ko:'🇰🇷'};
  const CODE_MAP = {ru:'RU',en:'EN',zh:'ZH',ko:'KO'};
  function build(){
    const header = document.querySelector('header');
    if (!header) return;
    if (header.querySelector('.klever-lang')) return;
    const lang = (typeof getSavedLang === 'function') ? getSavedLang() : 'ru';
    const wrap = document.createElement('div');
    wrap.className = 'klever-lang';
    wrap.innerHTML = '<button class="klever-lang-trigger" type="button" aria-label="Language">'
      + '<span class="klever-lang-current-flag">'+FLAG_MAP[lang]+'</span>'
      + '<span class="klever-lang-current-code">'+CODE_MAP[lang]+'</span>'
      + '<span class="klever-lang-caret">▼</span>'
      + '</button>'
      + '<div class="klever-lang-menu" role="menu">'
      + LANGS.map(l => '<button class="klever-lang-opt'+(l.code===lang?' active':'')+'" data-lang="'+l.code+'" type="button"><span class="flag">'+l.flag+'</span><span>'+l.label+'</span></button>').join('')
      + '</div>';
    const actions = header.querySelector('.header-actions');
    if (actions){
      const cartBtn = actions.querySelector('.cart-btn');
      if (cartBtn) actions.insertBefore(wrap, cartBtn);
      else actions.appendChild(wrap);
    } else {
      header.appendChild(wrap);
    }
    const trigger = wrap.querySelector('.klever-lang-trigger');
    trigger.addEventListener('click', e => {
      e.stopPropagation();
      wrap.classList.toggle('open');
    });
    wrap.querySelectorAll('.klever-lang-opt').forEach(b => {
      b.addEventListener('click', () => {
        const code = b.dataset.lang;
        if (typeof applyLanguage === 'function') applyLanguage(code);
        wrap.classList.remove('open');
      });
    });
    document.addEventListener('click', e => {
      if (!wrap.contains(e.target)) wrap.classList.remove('open');
    });
  }
  function init(){
    if (typeof applyLanguage === 'function') applyLanguage((typeof getSavedLang === 'function') ? getSavedLang() : 'ru');
    build();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

<script id="klever-tabbar-script">
(function(){
  // Mark active tab based on current path
  function currentKey(){
    const p = (location.pathname.split('/').pop()||'index.html').toLowerCase();
    if (p === '' || p === 'index.html') return 'home';
    if (p === 'catalog.html' || p === 'product.html' || p === 'sales.html') return 'catalog';
    if (p === 'account.html') return 'account';
    if (p === 'checkout.html') return 'cart';
    return null;
  }
  function syncBadge(){
    const el = document.getElementById('kleverTabCartBadge'); if (!el) return;
    let n = 0;
    try { const c = JSON.parse(localStorage.getItem('klever_cart')) || []; n = c.reduce((s,i)=>s+(i.qty||0), 0); } catch(e){}
    el.textContent = n;
    el.classList.toggle('show', n > 0);
  }
  document.addEventListener('DOMContentLoaded', function(){
    const key = currentKey();
    if (key) {
      const a = document.querySelector('.klever-tabbar a[data-tab-key="'+key+'"]');
      if (a) a.classList.add('active');
    }
    syncBadge();
    // Patch updateCartBadge if present so it also keeps tabbar badge in sync.
    if (typeof updateCartBadge === 'function') {
      const _orig = updateCartBadge;
      window.updateCartBadge = function(){ _orig(); syncBadge(); };
    }
    window.__kleverSyncTabBadge = syncBadge;
  });
  window.addEventListener('storage', e => { if (e.key === 'klever_cart') syncBadge(); });
})();
</script>
