<style>
:root{--green:#2ECC71;--green-dark:#1aab58;--green-light:#a8f0c6;--lime:#C8F135;--dark:#0f1a14;--dark2:#162119;--gray:#f2f7f4;--text:#1a2e22;--white:#ffffff;--accent:#FF6B35;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Onest',sans-serif;background:var(--white);color:var(--text);}
header{position:sticky;top:0;z-index:100;background:var(--dark);padding:0 40px;display:flex;align-items:center;justify-content:space-between;height:70px;border-bottom:2px solid var(--green);}
.logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:24px;color:var(--white);letter-spacing:-1px;display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo span{color:var(--lime);}
nav{display:flex;gap:32px;}
nav a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s;}
nav a:hover{color:var(--lime);}
.btn-phone{background:var(--green);color:var(--dark);padding:10px 20px;border-radius:40px;font-weight:700;font-size:14px;text-decoration:none;}
.breadcrumb{padding:16px 40px;background:var(--gray);font-size:13px;color:#8aaa94;}
.breadcrumb a{color:var(--green-dark);text-decoration:none;}
.breadcrumb a:hover{text-decoration:underline;}
.breadcrumb span{margin:0 8px;}
.product-wrap{max-width:1200px;margin:48px auto;padding:0 40px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start;}
.main-img{background:var(--gray);border-radius:24px;height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;border:2px solid #e0ece4;}
.main-img img{width:100%;height:100%;object-fit:contain;padding:24px;}
.main-img .placeholder{font-size:120px;}
.prod-badges{display:flex;gap:8px;margin-bottom:16px;}
.badge{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;}
.badge-hit{background:var(--accent);color:white;}
.badge-new{background:var(--green);color:var(--dark);}
.badge-sale{background:#FF3B6B;color:white;}
.badge-instock{background:#e8faf0;color:var(--green-dark);border:1px solid var(--green-light);}
.prod-title{font-family:'Unbounded',sans-serif;font-size:28px;font-weight:900;line-height:1.2;letter-spacing:-1px;margin-bottom:8px;}
.prod-sku{color:#8aaa94;font-size:13px;margin-bottom:24px;}
.prod-price-block{background:var(--gray);border-radius:20px;padding:24px;margin-bottom:24px;}
.price-label{font-size:12px;color:#8aaa94;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:6px;}
.price-main{font-family:'Unbounded',sans-serif;font-size:42px;font-weight:900;color:var(--green-dark);line-height:1;margin-bottom:4px;}
.price-unit{font-size:14px;color:#8aaa94;}
.counter-wrap{margin-bottom:24px;}
.counter-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:10px;}
.counter{display:inline-flex;align-items:center;border:2px solid #d0e8d8;border-radius:14px;overflow:hidden;}
.counter-btn{width:48px;height:48px;border:none;background:white;font-size:22px;cursor:pointer;color:var(--green-dark);font-weight:700;display:flex;align-items:center;justify-content:center;}
.counter-btn:hover{background:var(--gray);}
.counter-val{width:60px;text-align:center;font-family:'Unbounded',sans-serif;font-size:18px;font-weight:700;border:none;outline:none;background:white;color:var(--text);}
.buy-btns{display:flex;gap:12px;margin-bottom:28px;}
.btn-buy{flex:1;padding:18px;border-radius:14px;background:var(--green);border:none;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--dark);cursor:pointer;transition:all .2s;}
.btn-buy:hover{background:var(--lime);transform:translateY(-2px);}
.btn-cart{flex:1;padding:18px;border-radius:14px;background:white;border:2px solid #d0e8d8;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:var(--green-dark);cursor:pointer;}
.btn-cart:hover{border-color:var(--green);background:var(--gray);}
.delivery-info{border:1.5px solid #d0e8d8;border-radius:16px;padding:20px;margin-bottom:24px;}
.delivery-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
.delivery-row:not(:last-child){border-bottom:1px solid #e8f4ec;}
.delivery-icon{font-size:22px;flex-shrink:0;}
.delivery-text strong{display:block;font-weight:600;color:var(--text);font-size:14px;}
.delivery-text span{color:#8aaa94;font-size:13px;}
.description{max-width:1200px;margin:0 auto 60px;padding:0 40px;}
.desc-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:20px;}
.desc-text{font-size:15px;line-height:1.8;color:#4a6854;max-width:700px;}
.related{max-width:1200px;margin:0 auto 60px;padding:0 40px;}
.related-title{font-family:'Unbounded',sans-serif;font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:28px;}
.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.related-card{background:var(--gray);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;display:block;border:1.5px solid transparent;}
.related-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.1);border-color:var(--green-light);}
.related-img{background:white;height:130px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:48px;}
.related-img img{width:100%;height:100%;object-fit:contain;padding:12px;}
.related-info{padding:14px;}
.related-name{font-size:13px;font-weight:600;margin-bottom:8px;line-height:1.4;}
.related-price{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:900;color:var(--green-dark);}
.not-found{max-width:600px;margin:80px auto;padding:0 20px;text-align:center;}
.not-found h2{font-family:'Unbounded',sans-serif;font-size:32px;margin-bottom:12px;}
.not-found p{color:#8aaa94;margin-bottom:24px;}
.not-found a{display:inline-block;background:var(--green);color:var(--dark);padding:14px 28px;border-radius:30px;font-weight:700;text-decoration:none;}
footer{background:var(--dark2);padding:40px;border-top:2px solid rgba(46,204,113,0.2);display:flex;justify-content:space-between;align-items:center;}
.footer-logo{font-family:'Unbounded',sans-serif;font-weight:900;font-size:20px;color:white;}
.footer-logo span{color:var(--lime);}
footer p{color:rgba(255,255,255,0.25);font-size:13px;}
.footer-links{display:flex;gap:24px;}
.footer-links a{color:rgba(255,255,255,0.4);text-decoration:none;font-size:13px;}
.footer-links a:hover{color:var(--green);}
@media(max-width:900px){.product-wrap{grid-template-columns:1fr;padding:0 20px;gap:32px;margin:24px auto;}.related-grid{grid-template-columns:repeat(2,1fr);gap:14px;}header{padding:0 20px;}nav{display:none;}.related,.description{padding:0 20px;}}
@media(max-width:600px){.product-wrap{padding:0 16px;gap:24px;margin:16px auto;}.related,.description{padding:0 16px;}}
@media(max-width:360px){.related-grid{grid-template-columns:1fr;}}
</style>
<style id="cart-inline-styles">

.btn-checkout{width:100%;padding:16px;background:#2ECC71;border:none;border-radius:14px;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;color:#0f1a14;cursor:pointer;transition:all .2s;}

<script id="cart-inline-script">
const CART_KEY='klever_cart';
function getCart(){try{return JSON.parse(localStorage.getItem(CART_KEY))||[];}catch(e){return[];}}
function saveCart(c){localStorage.setItem(CART_KEY,JSON.stringify(c));updateCartBadge();}
function addToCart(p){const c=getCart();const e=c.find(i=>i.sku===p.sku);if(e)e.qty++;else c.push({...p,qty:1});saveCart(c);showAddedToast(p.name);}
function removeFromCart(s){let c=getCart();c=c.filter(i=>i.sku!==s);saveCart(c);renderCart();}
function changeQty(s,d){const c=getCart();const i=c.find(x=>x.sku===s);if(!i)return;i.qty+=d;if(i.qty<=0){removeFromCart(s);return;}saveCart(c);renderCart();}
function getCartTotal(){return getCart().reduce((s,i)=>s+i.price*i.qty,0);}
function getCartCount(){return getCart().reduce((s,i)=>s+i.qty,0);}
function updateCartBadge(){const b=document.getElementById('cartBadge');if(!b)return;const c=getCartCount();b.textContent=c;b.style.display=c>0?'flex':'none';}
function openCart(){document.getElementById('cartOverlay').classList.add('open');document.getElementById('cartPanel').classList.add('open');document.body.style.overflow='hidden';renderCart();}
function closeCart(){document.getElementById('cartOverlay').classList.remove('open');document.getElementById('cartPanel').classList.remove('open');document.body.style.overflow='';}
function getProdImg(sku,fallback){try{const arr=JSON.parse(localStorage.getItem('klever_products_v2'))||[];const p=arr.find(x=>x.sku===sku);return (p&&p.img)||fallback||'';}catch(e){return fallback||'';}}
function renderCart(){const cart=getCart();const items=document.getElementById('cartItems');const total=document.getElementById('cartTotal');if(!items)return;if(cart.length===0){items.innerHTML='<div class="cart-empty"><div style="font-size:56px;margin-bottom:16px;">🛒</div><div style="font-family:Unbounded,sans-serif;font-weight:700;font-size:18px;margin-bottom:8px;">Корзина пуста</div><div style="color:#8aaa94;font-size:14px;">Добавьте товары из каталога</div></div>';total.textContent='0 ₽';return;}items.innerHTML=cart.map(i=>{const _img=getProdImg(i.sku,i.img);return '<div class="cart-item"><div class="cart-item-img">'+(_img?'<img src="'+_img+'" alt="" onerror="this.outerHTML=\'<span style=font-size:24px>📦</span>\'">':'<span style="font-size:24px">📦</span>')+'</div><div class="cart-item-info"><div class="cart-item-name">'+i.name+'</div><div class="cart-item-sku">Арт. '+i.sku+' · '+i.price+' ₽</div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty(\''+i.sku+'\', -1)">−</button><span class="qty-val">'+i.qty+'</span><button class="qty-btn" onclick="changeQty(\''+i.sku+'\', 1)">+</button><button class="remove-btn" onclick="removeFromCart(\''+i.sku+'\')">Удалить</button></div></div><div class="cart-item-price">'+(i.price*i.qty)+' ₽</div></div>';}).join('');total.textContent=getCartTotal()+' ₽';}
function checkout(){if(getCartCount()===0){alert('Корзина пуста! Добавьте товары.');return;}window.location.href='checkout.html';}
function showAddedToast(name){let t=document.getElementById('cartToast');if(t)t.remove();t=document.createElement('div');t.id='cartToast';t.className='cart-toast';t.innerHTML='<span style="color:#2ECC71;font-weight:700;font-size:18px;">✓</span> «'+name+'» добавлен в корзину';document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},2200);}
document.addEventListener('DOMContentLoaded',updateCartBadge);
</script>

// Загружаем товары: из localStorage (если есть) или дефолт
let PRODUCTS;
try {
  const stored = localStorage.getItem('klever_products_v2');
  const parsed = stored ? JSON.parse(stored) : null;
  if (parsed && Array.isArray(parsed) && parsed.length > 0) {
    PRODUCTS = parsed;
  } else {
    PRODUCTS = DEFAULT_PRODUCTS;
    localStorage.setItem('klever_products_v2', JSON.stringify(DEFAULT_PRODUCTS));
  }
} catch(e) {
  PRODUCTS = DEFAULT_PRODUCTS;
}


// Парсим SKU из URL
const urlParams = new URLSearchParams(window.location.search);
const sku = urlParams.get('sku') || PRODUCTS[0].sku;
const product = PRODUCTS.find(p => p.sku === sku);

function badgeHtml(b) {
  if (b==='hit') return '<span class="badge badge-hit">🔥 ХИТ ПРОДАЖ</span>';
  if (b==='new') return '<span class="badge badge-new">✨ НОВИНКА</span>';
  if (b==='sale') return '<span class="badge badge-sale">-20%</span>';
  return '';
}

function renderProduct() {
  if (!product) {
    document.getElementById('productContent').innerHTML = `
      <div class="not-found">
        <h2>Товар не найден 😔</h2>
        <p>Возможно, такого товара нет в нашем каталоге.</p>
        <a href="catalog.html">Вернуться в каталог →</a>
      </div>`;
    document.title = 'Товар не найден — КЛЕВЕР';
    return;
  }

  document.title = product.name + ' — КЛЕВЕР';

  document.getElementById('breadcrumb').innerHTML = `
    <a href="index.html">Главная</a><span>→</span>
    <a href="catalog.html">Каталог</a><span>→</span>
    ${product.cat}<span>→</span>${product.name}
  `;

  const imgHtml = product.img
    ? `<img id="mainImg" src="${product.img}" alt="${product.name}" onerror="this.outerHTML='<span class=placeholder>${product.emoji||'📦'}</span>'">`
    : `<span class="placeholder">${product.emoji||'📦'}</span>`;

  // Похожие товары - 4 рандомных из той же категории
  const related = PRODUCTS.filter(p => p.cat === product.cat && p.sku !== product.sku).slice(0, 4);

  document.getElementById('productContent').innerHTML = `
    <div class="product-wrap">
      <div class="product-images">
        <div class="main-img">${imgHtml}</div>
      </div>

      <div class="product-info">
        <div class="prod-badges">
          ${badgeHtml(product.badge)}
          <span class="badge badge-instock">✓ В наличии</span>
        </div>

        <h1 class="prod-title">${product.name}</h1>
        <div class="prod-sku">Артикул: ${product.sku} · ${product.cat}</div>

        <div class="prod-price-block">
          <div class="price-label">Цена</div>
          <div class="price-main">${product.price} ₽</div>
          <div class="price-unit">за 1 штуку · от 1 шт</div>
        </div>

        <div class="counter-wrap">
          <div class="counter-label">Количество:</div>
          <div class="counter">
            <button class="counter-btn" onclick="changeQtyLocal(-1)">−</button>
            <input class="counter-val" id="qty" type="number" value="1" min="1">
            <button class="counter-btn" onclick="changeQtyLocal(1)">+</button>
          </div>
        </div>

        <div class="buy-btns">
          <button class="btn-buy" onclick="buyNow()">Купить сейчас</button>
          <button class="btn-cart" onclick="addCurrentToCart()">🛒 В корзину</button>
        </div>

        <div class="delivery-info">
          <div class="delivery-row">
            <div class="delivery-icon">🚚</div>
            <div class="delivery-text"><strong>Доставка по СПб — 1 день</strong><span>Отправляем в день заказа при заказе до 14:00</span></div>
          </div>
          <div class="delivery-row">
            <div class="delivery-icon">📦</div>
            <div class="delivery-text"><strong>Самовывоз бесплатно</strong><span>ул. Софийская 4 к 3, павильон 29/8</span></div>
          </div>
          <div class="delivery-row">
            <div class="delivery-icon">🔄</div>
            <div class="delivery-text"><strong>Возврат и обмен</strong><span>Гарантируем обмен или полный возврат</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="description">
      <div class="desc-title">Описание</div>
      <div class="desc-text">${product.desc}</div>
    </div>

    ${related.length > 0 ? `
    <div class="related">
      <div class="related-title">Похожие товары</div>
      <div class="related-grid">
        ${related.map(r => `
          <a href="product.html?sku=${r.sku}" class="related-card">
            <div class="related-img">${r.img ? `<img src="${r.img}" alt="" onerror="this.outerHTML='${r.emoji||'📦'}'">` : (r.emoji||'📦')}</div>
            <div class="related-info">
              <div class="related-name">${r.name}</div>
              <div class="related-price">${r.price} ₽</div>
            </div>
          </a>
        `).join('')}
      </div>
    </div>` : ''}
  `;
}

function changeQtyLocal(delta) {
  const el = document.getElementById('qty');
  el.value = Math.max(1, parseInt(el.value) + delta);
}

function addCurrentToCart() {
  const qty = parseInt(document.getElementById('qty').value) || 1;
  for (let i = 0; i < qty; i++) {
    addToCart({name: product.name, sku: product.sku, price: product.price, img: product.img || ''});
  }
}

function buyNow() {
  addCurrentToCart();
  setTimeout(openCart, 300);
}

renderProduct();

<script id="news-modal-script">
(function(){
  const NEWS_KEY = 'klever_news';
  const SEEN_KEY = 'klever_news_seen';
  function getNews(){ try{ const a=JSON.parse(localStorage.getItem(NEWS_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function getSeen(){ try{ const a=JSON.parse(localStorage.getItem(SEEN_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function setSeen(a){ localStorage.setItem(SEEN_KEY, JSON.stringify(a)); }
  let currentNews = null;
  function pickNext(){
    const seen = getSeen();
    return getNews().find(n => n.active && !seen.includes(n.id));
  }
  function show(n){
    currentNews = n;
    const banner = document.getElementById('kleverNewsBanner');
    banner.classList.remove('green','orange','blue');
    banner.classList.add(['green','orange','blue'].includes(n.color) ? n.color : 'green');
    document.getElementById('kleverNewsTitle').textContent = n.title || '';
    document.getElementById('kleverNewsText').textContent = n.text || '';
    document.getElementById('kleverNewsOverlay').classList.add('open');
  }
  window.kleverNewsDismiss = function(){
    if (currentNews) {
      const seen = getSeen();
      if (!seen.includes(currentNews.id)) { seen.push(currentNews.id); setSeen(seen); }
    }
    document.getElementById('kleverNewsOverlay').classList.remove('open');
    currentNews = null;
    setTimeout(function(){
      const next = pickNext();
      if (next) show(next);
    }, 400);
  };
  document.addEventListener('DOMContentLoaded', function(){
    setTimeout(function(){
      const n = pickNext();
      if (n) show(n);
    }, 800);
  });
})();
</script>

<script id="burger-menu-script">
(function(){
  function buildMenu(){
    const header = document.querySelector('header');
    if (!header) return;
    if (header.querySelector('.mobile-burger-btn')) return;
    // Get nav links (mainnav)
    const navAnchors = header.querySelectorAll('nav a');
    const links = [...navAnchors].map(a => {
      const isActive = a.classList.contains('active');
      const href = a.getAttribute('href') || '#';
      const text = a.textContent.trim();
      return '<a href="'+href+'" '+(isActive?'class="active"':'')+'>'+text+'</a>';
    }).join('');
    // Find phone link
    let phoneHref = 'tel:+78129228677', phoneText = '📞 Позвонить';
    const phoneEl = header.querySelector('.btn-phone, a[href^="tel:"]');
    if (phoneEl) { phoneHref = phoneEl.getAttribute('href'); phoneText = phoneEl.textContent.trim(); }
    // Build menu HTML
    const overlay = document.createElement('div');
    overlay.className = 'mobile-menu-overlay';
    overlay.id = 'mobileMenuOverlay';
    overlay.onclick = closeMenu;
    const panel = document.createElement('aside');
    panel.className = 'mobile-menu-panel';
    panel.id = 'mobileMenuPanel';
    panel.innerHTML = '<div class="mobile-menu-head">'
      + '<span class="mm-title">🍀 Меню</span>'
      + '<button class="mobile-menu-close" onclick="window.__kleverCloseMobileMenu()">✕</button>'
      + '</div>'
      + '<div class="mobile-menu-links">'+links+'</div>'
      + '<div class="mobile-menu-actions">'
      + '<a href="account.html">👤 Личный кабинет</a>'
      + '<button id="mmCartBtn">🛒 Корзина <span class="mm-cart-badge empty" id="mmCartBadge">0</span></button>'
      + '<a href="'+phoneHref+'" class="mobile-menu-phone">'+phoneText+'</a>'
      + '</div>';
    document.body.appendChild(overlay);
    document.body.appendChild(panel);
    // Cart button
    const cartBtn = panel.querySelector('#mmCartBtn');
    cartBtn.onclick = function(){
      closeMenu();
      setTimeout(function(){ if (typeof openCart === 'function') openCart(); }, 280);
    };
    // Burger button — insert into header
    const burger = document.createElement('button');
    burger.className = 'mobile-burger-btn';
    burger.setAttribute('aria-label','Открыть меню');
    burger.innerHTML = '☰';
    burger.onclick = openMenu;
    const actions = header.querySelector('.header-actions');
    if (actions) actions.appendChild(burger);
    else header.appendChild(burger);
    updateMmCart();
  }
  function openMenu(){
    document.getElementById('mobileMenuOverlay').classList.add('open');
    document.getElementById('mobileMenuPanel').classList.add('open');
    document.body.style.overflow='hidden';
    updateMmCart();
  }
  function closeMenu(){
    const o = document.getElementById('mobileMenuOverlay');
    const p = document.getElementById('mobileMenuPanel');
    if (o) o.classList.remove('open');
    if (p) p.classList.remove('open');
    document.body.style.overflow='';
  }
  function updateMmCart(){
    const badge = document.getElementById('mmCartBadge');
    if (!badge) return;
    let count = 0;
    try { const c = JSON.parse(localStorage.getItem('klever_cart')) || []; count = c.reduce((s,i)=>s+(i.qty||0),0); } catch(e){}
    badge.textContent = count;
    if (count > 0) badge.classList.remove('empty'); else badge.classList.add('empty');
  }
  window.__kleverCloseMobileMenu = closeMenu;
  window.__kleverUpdateMmCart = updateMmCart;
  document.addEventListener('DOMContentLoaded', buildMenu);
  // Refresh badge when cart changes (same tab via custom polling; cross-tab via storage)
  window.addEventListener('storage', e => { if (e.key === 'klever_cart') updateMmCart(); });
  // Patch updateCartBadge if exists to also sync mm
  const _origInterval = setInterval(function(){ if (typeof updateCartBadge === 'function') { const _orig = updateCartBadge; window.updateCartBadge = function(){ _orig(); updateMmCart(); }; clearInterval(_origInterval); } }, 100);
  setTimeout(function(){ clearInterval(_origInterval); }, 3000);
})();
</script>

<div class="klever-search-overlay" id="kleverSearchOverlay"></div>
<div class="klever-search-panel" id="kleverSearchPanel">
  <div class="klever-search-row">
    <input type="text" class="klever-search-input" id="kleverSearchInput" placeholder="Поиск по названию или артикулу..." autocomplete="off">
    <button class="klever-search-close" onclick="kleverSearchClose()" aria-label="Закрыть">✕</button>
  </div>
  <div class="klever-search-results" id="kleverSearchResults"></div>
</div>
<script id="klever-search-script">
(function(){
  let debounceT = null;
  function getProducts(){
    try{ const a=JSON.parse(localStorage.getItem('klever_products_v2')); return Array.isArray(a)?a:[]; }catch(e){ return []; }
  }
  function escHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function openSearch(){
    document.getElementById('kleverSearchOverlay').classList.add('open');
    document.getElementById('kleverSearchPanel').classList.add('open');
    document.body.style.overflow='hidden';
    setTimeout(()=>document.getElementById('kleverSearchInput').focus(), 100);
  }
  function closeSearch(){
    document.getElementById('kleverSearchOverlay').classList.remove('open');
    document.getElementById('kleverSearchPanel').classList.remove('open');
    document.body.style.overflow='';
    document.getElementById('kleverSearchInput').value='';
    const r = document.getElementById('kleverSearchResults');
    r.classList.remove('has-content'); r.innerHTML='';
  }
  function render(query){
    const box = document.getElementById('kleverSearchResults');
    const q = query.trim().toLowerCase();
    if (!q){ box.classList.remove('has-content'); box.innerHTML=''; return; }
    const all = getProducts();
    const matches = all.filter(p => {
      const n = (p.name||'').toLowerCase();
      const s = (p.sku||'').toString().toLowerCase();
      return n.includes(q) || s.includes(q);
    }).slice(0, 8);
    box.classList.add('has-content');
    if (matches.length === 0){
      box.innerHTML = '<div class="klever-search-empty"><span class="emoji">🔍</span>Ничего не найдено по запросу «'+escHtml(query)+'»</div>';
      return;
    }
    box.innerHTML = matches.map(p => {
      const imgHtml = p.img ? '<img src="'+escHtml(p.img)+'" alt="" onerror="this.outerHTML=\'<span style=font-size:22px>📦</span>\'">' : '<span style="font-size:22px">📦</span>';
      const cartData = escHtml(JSON.stringify({name:p.name,sku:p.sku,price:p.price,img:p.img||''}));
      return '<a href="product.html?sku='+escHtml(p.sku)+'" class="klever-search-result">'
        + '<div class="klever-search-result-img">'+imgHtml+'</div>'
        + '<div><div class="klever-search-result-name">'+escHtml(p.name)+'</div><div class="klever-search-result-sku">Арт. '+escHtml(p.sku)+'</div></div>'
        + '<div class="klever-search-result-price">'+escHtml(p.price)+' ₽</div>'
        + '<button class="klever-search-result-add" onclick="event.preventDefault();event.stopPropagation();kleverSearchAdd('+cartData+')" aria-label="В корзину">+</button>'
        + '</a>';
    }).join('');
  }
  window.kleverSearchClose = closeSearch;
  window.kleverSearchAdd = function(p){
    if (typeof addToCart === 'function') { addToCart(p); return; }
    try {
      const cart = JSON.parse(localStorage.getItem('klever_cart')||'[]');
      const ex = cart.find(i => i.sku === p.sku);
      if (ex) ex.qty++; else cart.push({...p, qty:1});
      localStorage.setItem('klever_cart', JSON.stringify(cart));
    } catch(e){}
    if (typeof updateCartBadge === 'function') updateCartBadge();
    if (typeof window.__kleverUpdateMmCart === 'function') window.__kleverUpdateMmCart();
  };
  document.addEventListener('DOMContentLoaded', function(){
    const header = document.querySelector('header');
    if (!header) return;
    if (header.querySelector('.search-trigger')) return;
    const btn = document.createElement('button');
    btn.className = 'search-trigger';
    btn.setAttribute('aria-label','Поиск');
    btn.innerHTML = '🔍';
    btn.onclick = openSearch;
    const actions = header.querySelector('.header-actions');
    if (actions){
      const phoneBtn = actions.querySelector('.btn-phone');
      if (phoneBtn && phoneBtn.nextSibling) actions.insertBefore(btn, phoneBtn.nextSibling);
      else actions.insertBefore(btn, actions.firstChild);
    } else { header.appendChild(btn); }
    const input = document.getElementById('kleverSearchInput');
    input.addEventListener('input', e => {
      clearTimeout(debounceT);
      const q = e.target.value;
      debounceT = setTimeout(()=>render(q), 300);
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('kleverSearchPanel').classList.contains('open')) closeSearch(); });
    document.getElementById('kleverSearchOverlay').addEventListener('click', closeSearch);
  });
})();
</script>
